name: Build Xperiment Anti-Cheat

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: xperiment-anticheat
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
